name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Regenerate data, validate, lint model, lint queries, render docs
        run: make all
      - name: Unit tests
        run: make test
      - name: Generated files must be committed and up to date
        run: git diff --exit-code -- data cypher docs
